name: Verify Commander Online Multiplayer (Two Browsers)
on:
  pull_request:
    branches: [main]
    paths:
      - "src/commander/multiplayer/**"
      - "src/commander/Commander.tsx"
      - "src/commander/Cabin.tsx"
      - "src/commander/campaign/Flight.tsx"
      - "scripts/commander-online-browser-smoke.ts"
      - ".github/workflows/commander-online-browser.yml"
  workflow_dispatch:
jobs:
  real-browser-peer-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install game dependencies
        run: npm ci
      - name: Install browser smoke test runner (not a runtime game dependency)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium with headless system libraries
        run: npx playwright install --with-deps chromium
      - name: Start local game
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/commander-coop-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              echo "Game is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commander-coop-vite.log
          exit 1
      - name: Test real peer connection and visible teammates in both browsers
        env:
          COOP_TEST_URL: http://127.0.0.1:4173/
        run: node --import tsx scripts/commander-online-browser-smoke.ts
      - name: Show server logs if browser test fails
        if: failure()
        run: cat /tmp/commander-coop-vite.log || true
