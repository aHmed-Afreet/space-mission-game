name: Verify Commander Game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real-browser Commander WebRTC connectivity (4 independent clients)
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/orbital-vite.log 2>&1 &
          node e2e/commander-crew-smoke.mjs
